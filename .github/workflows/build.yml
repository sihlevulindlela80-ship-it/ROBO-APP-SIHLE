name: Build ROBO EA APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your ROBO EA website address (the Netlify link)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event.inputs.site_url }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create the Android project
        run: |
          set -e
          mkdir -p robo/app/src/main/java/com/roboea/app robo/app/src/main/assets robo/app/src/main/res/mipmap-xxxhdpi
          cd robo
          cat > settings.gradle <<'ROBOEOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "roboea"
          include ':app'
          ROBOEOF
          cat > build.gradle <<'ROBOEOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
          }
          ROBOEOF
          cat > gradle.properties <<'ROBOEOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          ROBOEOF
          cat > app/build.gradle <<'ROBOEOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.roboea.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.roboea.app'
              minSdk 24
              targetSdk 33
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          ROBOEOF
          cat > app/src/main/AndroidManifest.xml <<'ROBOEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
            <application
                android:label="ROBO EA"
                android:icon="@mipmap/ic_launcher"
                android:allowBackup="false"
                android:usesCleartextTraffic="false"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:launchMode="singleTask"
                  android:configChanges="orientation|screenSize|keyboardHidden|keyboard|screenLayout|smallestScreenSize|uiMode|density|fontScale"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <service android:name=".BotService" android:exported="false" />
            </application>
          </manifest>
          ROBOEOF
          cat > app/src/main/java/com/roboea/app/MainActivity.java <<'ROBOEOF'
          package com.roboea.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.MutableContextWrapper;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          public class MainActivity extends Activity {
            static WebView web;
            static MutableContextWrapper wrap;
            static MainActivity current;
            static volatile boolean visible = false;
            static ValueCallback<Uri[]> fileCb;
            static String host = "";
            FrameLayout root;
            boolean askedOverlay = false, askedBatt = false;

            public static class Bridge {
              @JavascriptInterface
              public void push(String j) { BotService.update(j); }
            }

            static String readAsset(Context c, String n) {
              try {
                InputStream in = c.getAssets().open(n);
                ByteArrayOutputStream o = new ByteArrayOutputStream();
                byte[] b = new byte[4096];
                int k;
                while ((k = in.read(b)) > 0) o.write(b, 0, k);
                in.close();
                return o.toString("UTF-8");
              } catch (Exception e) { return ""; }
            }

            void makeWeb() {
              wrap = new MutableContextWrapper(getApplicationContext());
              web = new WebView(wrap);
              web.setBackgroundColor(0xFF000000);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(false);
              CookieManager.getInstance().setAcceptCookie(true);
              String url = readAsset(this, "url.txt").trim();
              try { host = Uri.parse(url).getHost(); } catch (Exception e) { host = ""; }
              web.addJavascriptInterface(new Bridge(), "RoboNative");
              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  String h = u.getHost();
                  if (h != null && h.equals(host)) return false;
                  String sc = u.getScheme();
                  if ("http".equals(sc) || "https".equals(sc) || "tel".equals(sc) || "mailto".equals(sc)) {
                    try {
                      Intent i = new Intent(Intent.ACTION_VIEW, u);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      v.getContext().getApplicationContext().startActivity(i);
                    } catch (Exception e) { }
                  }
                  return true;
                }
                @Override
                public void onPageFinished(WebView v, String u) {
                  v.evaluateJavascript(readAsset(v.getContext().getApplicationContext(), "inject.js"), null);
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  MainActivity a = current;
                  if (a == null) return false;
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  try {
                    a.startActivityForResult(p.createIntent(), 11);
                  } catch (Exception e) {
                    fileCb = null;
                    return false;
                  }
                  return true;
                }
              });
              web.loadUrl(url);
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              current = this;
              getWindow().setStatusBarColor(0xFF000000);
              getWindow().setNavigationBarColor(0xFF000000);
              root = new FrameLayout(this);
              root.setBackgroundColor(0xFF000000);
              setContentView(root);
              if (web == null) makeWeb();
              wrap.setBaseContext(this);
              ViewGroup p = (ViewGroup) web.getParent();
              if (p != null) p.removeView(web);
              root.addView(web, new FrameLayout.LayoutParams(-1, -1));
              startBot();
              if (Build.VERSION.SDK_INT >= 33
                  && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[] {"android.permission.POST_NOTIFICATIONS"}, 21);
              }
            }

            void startBot() {
              Intent i = new Intent(this, BotService.class);
              if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
            }

            @Override
            protected void onResume() {
              super.onResume();
              visible = true;
              web.resumeTimers();
              startBot();
              if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this) && !askedOverlay) {
                askedOverlay = true;
                new AlertDialog.Builder(this)
                    .setTitle("Floating robot")
                    .setMessage("Allow \"Display over other apps\" so the round robot can float over other apps and show your trades.")
                    .setPositiveButton("Allow", (d, w) -> startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()))))
                    .setNegativeButton("Not now", null)
                    .show();
              } else if (Build.VERSION.SDK_INT >= 23 && !askedBatt) {
                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                if (!pm.isIgnoringBatteryOptimizations(getPackageName())) {
                  askedBatt = true;
                  new AlertDialog.Builder(this)
                      .setTitle("Keep trading in the background")
                      .setMessage("Allow ROBO EA to run without battery limits so the phone does not freeze the bot when the screen is off.")
                      .setPositiveButton("Allow", (d, w) -> startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName()))))
                      .setNegativeButton("Not now", null)
                      .show();
                }
              }
            }

            @Override
            protected void onPause() {
              super.onPause();
              visible = false;
              if (web != null) web.resumeTimers();
            }

            @Override
            protected void onStop() {
              super.onStop();
              if (web != null) web.resumeTimers();
            }

            @Override
            protected void onActivityResult(int rq, int rs, Intent d) {
              if (rq == 11) {
                if (fileCb != null) {
                  fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d));
                  fileCb = null;
                }
                return;
              }
              super.onActivityResult(rq, rs, d);
            }

            @Override
            public void onBackPressed() {
              if (web != null && web.canGoBack()) web.goBack(); else moveTaskToBack(true);
            }

            @Override
            protected void onDestroy() {
              current = null;
              visible = false;
              try { root.removeView(web); } catch (Exception e) { }
              if (wrap != null) wrap.setBaseContext(getApplicationContext());
              super.onDestroy();
            }
          }
          ROBOEOF
          cat > app/src/main/java/com/roboea/app/BotService.java <<'ROBOEOF'
          package com.roboea.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.BitmapShader;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Shader;
          import android.graphics.drawable.GradientDrawable;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.text.DecimalFormat;
          import java.text.DecimalFormatSymbols;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BotService extends Service {
            static volatile String latest = "";
            static volatile long lastPush = 0;

            static void update(String j) {
              latest = j;
              lastPush = System.currentTimeMillis();
            }

            static final DecimalFormat PX = new DecimalFormat("0.#####", DecimalFormatSymbols.getInstance(Locale.US));
            static final int GREEN = 0xFF2ECC71, RED = 0xFFE53935, AMBER = 0xFFFFB020, GREY = 0xFFB4B9C2;
            static final int HEAD_DP = 220;

            WindowManager wm;
            LinearLayout box, panel, head, body, checks, logList;
            ScrollView bodySv;
            ImageView bubble, logo, avatar;
            TextView nameTv, modeTv, closeBtn, gridBtn, stBtn, stopBtn;
            WindowManager.LayoutParams lp;
            Handler h = new Handler(Looper.getMainLooper());
            PowerManager.WakeLock wl;
            boolean open = false, added = false, run = false, conn = false, stopArmed = false, statusOpen = false;
            int panelW = 0, bodyDp = 300, srcHash = -1, avHash = -2;
            String shown = "", ringKey = "", fillKey = "", imgData = "", name = "ROBO EA", modeName = "";
            Bitmap srcBmp, plugBmp, logoBmp;
            JSONObject cur = null;

            Runnable tick = new Runnable() {
              public void run() {
                try { refresh(); } catch (Throwable t) { }
                h.postDelayed(this, 1500);
              }
            };

            int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density + 0.5f); }

            @Override
            public IBinder onBind(Intent i) { return null; }

            @Override
            public void onCreate() {
              super.onCreate();
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel("roboea", "ROBO EA running", NotificationManager.IMPORTANCE_LOW);
                ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
              }
              PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
              wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "roboea:bot");
              wl.setReferenceCounted(false);
              wl.acquire();
              h.post(tick);
            }

            @Override
            public int onStartCommand(Intent in, int flags, int id) {
              Intent oi = new Intent(this, MainActivity.class);
              oi.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
              PendingIntent pi = PendingIntent.getActivity(this, 0, oi,
                  PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));
              Notification.Builder nb = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "roboea") : new Notification.Builder(this);
              Notification n = nb.setContentTitle("ROBO EA is running")
                  .setContentText("Tap to open. Trades are managed in the background.")
                  .setSmallIcon(android.R.drawable.ic_dialog_info)
                  .setContentIntent(pi)
                  .setOngoing(true)
                  .build();
              startForeground(1, n);
              return START_STICKY;
            }

            void ensureBubble() {
              if (added) return;
              if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) return;
              try {
                build();
                added = true;
              } catch (Throwable t) { added = false; }
            }

            TextView tv(String s, int sp, int color, boolean bold) {
              TextView t = new TextView(this);
              t.setText(s);
              t.setTextSize(sp);
              t.setTextColor(color);
              if (bold) t.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              return t;
            }

            GradientDrawable shape(int color, int radiusDp, int strokeColor, int strokeDp) {
              GradientDrawable g = new GradientDrawable();
              g.setColor(color);
              g.setCornerRadius(dp(radiusDp));
              if (strokeDp > 0) g.setStroke(dp(strokeDp), strokeColor);
              return g;
            }

            static Bitmap whiteLogo(Bitmap src) {
              // Clean white logo with sharp edges, full transparency outside
              int w = src.getWidth(), hh = src.getHeight();
              int[] px = new int[w * hh];
              src.getPixels(px, 0, w, 0, 0, w, hh);
              for (int i = 0; i < px.length; i++) {
                int c = px[i];
                int a0 = Color.alpha(c);
                if (a0 < 8) { px[i] = 0; continue; }
                int r = Color.red(c), g = Color.green(c), b = Color.blue(c);
                int bri = (r + g + b) / 3;
                if (bri < 70) { px[i] = 0; continue; }
                // keep bright pixels solid white for sharp detail
                int a = Math.min(255, (bri - 40) * 255 / 140);
                a = (a * a0) / 255;
                if (a < 25) a = 0;
                px[i] = Color.argb(a, 255, 255, 255);
              }
              Bitmap o = Bitmap.createBitmap(w, hh, Bitmap.Config.ARGB_8888);
              o.setPixels(px, 0, w, 0, 0, w, hh);
              return o;
            }

            // Pure stand-alone logo – sharp, detailed, zero background
            static Bitmap transparentLogo(Bitmap src, int size) {
              Bitmap white = whiteLogo(src);
              // scale with high quality then draw once for crisp result
              Bitmap scaled = Bitmap.createScaledBitmap(white, size, size, true);
              Bitmap out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
              Canvas c = new Canvas(out);
              c.drawColor(Color.TRANSPARENT);
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
              p.setDither(true);
              c.drawBitmap(scaled, 0, 0, p);
              return out;
            }

            void build() {
              wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              try {
                byte[] d = Base64.decode(MainActivity.readAsset(this, "plug.b64").trim(), Base64.DEFAULT);
                plugBmp = BitmapFactory.decodeByteArray(d, 0, d.length);
              } catch (Throwable t) { plugBmp = null; }
              if (plugBmp == null) plugBmp = BitmapFactory.decodeResource(getResources(), R.mipmap.ic_launcher);
              logoBmp = whiteLogo(plugBmp);

              box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL);
              box.setBackgroundColor(0);
              box.setPadding(0, 0, 0, 0);
              bubble = new ImageView(this);
              bubble.setBackgroundColor(0);
              bubble.setPadding(0, 0, 0, 0);
              bubble.setScaleType(ImageView.ScaleType.FIT_CENTER);
              bubble.setAdjustViewBounds(true);
              // smaller + sharper floating size
              box.addView(bubble, new LinearLayout.LayoutParams(dp(40), dp(40)));

              panel = new LinearLayout(this);
              panel.setOrientation(LinearLayout.VERTICAL);
              panel.setBackground(shape(0xFF0D0D0D, 18, 0xFF222222, 1));

              // ---- dark header card: bot picture, name, STATUS / CLOSE ----
              head = new LinearLayout(this);
              head.setOrientation(LinearLayout.VERTICAL);
              head.setGravity(Gravity.CENTER_HORIZONTAL);
              head.setPadding(dp(12), dp(14), dp(12), dp(10));
              setHeadBg();

              avatar = new ImageView(this);
              head.addView(avatar, new LinearLayout.LayoutParams(dp(72), dp(72)));

              nameTv = tv("ROBO EA", 16, 0xFFFFFFFF, true);
              nameTv.setGravity(Gravity.CENTER);
              nameTv.setSingleLine(true);
              nameTv.setEllipsize(android.text.TextUtils.TruncateAt.END);
              nameTv.setLetterSpacing(0.08f);
              LinearLayout.LayoutParams np = new LinearLayout.LayoutParams(-1, -2);
              np.topMargin = dp(8);
              head.addView(nameTv, np);
              modeTv = tv("", 12, 0xFFFFB3B3, true);
              modeTv.setGravity(Gravity.CENTER);
              modeTv.setSingleLine(true);
              head.addView(modeTv, new LinearLayout.LayoutParams(-1, -2));

              LinearLayout btns = new LinearLayout(this);
              btns.setOrientation(LinearLayout.HORIZONTAL);
              btns.setGravity(Gravity.CENTER_VERTICAL);
              btns.setBackground(shape(0x66000000, 0, 0, 0));
              gridBtn = tv("\u25A6", 20, 0xFFFFFFFF, true);
              gridBtn.setGravity(Gravity.CENTER);
              gridBtn.setPadding(0, dp(10), 0, dp(10));
              stBtn = tv("STATUS", 15, 0xFFFFFFFF, true);
              stBtn.setGravity(Gravity.CENTER);
              stBtn.setPadding(0, dp(10), 0, dp(10));
              closeBtn = tv("\u2715  CLOSE", 15, 0xFFFFFFFF, true);
              closeBtn.setGravity(Gravity.CENTER);
              closeBtn.setPadding(0, dp(10), 0, dp(10));
              btns.addView(gridBtn, new LinearLayout.LayoutParams(dp(52), -2));
              btns.addView(stBtn, new LinearLayout.LayoutParams(0, -2, 1f));
              btns.addView(closeBtn, new LinearLayout.LayoutParams(0, -2, 1f));
              LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(-1, -2);
              bp.topMargin = dp(6);
              head.addView(btns, bp);
              panel.addView(head, new LinearLayout.LayoutParams(-1, -2));

              gridBtn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) {
                  Intent i = new Intent(BotService.this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  startActivity(i);
                }
              });
              stBtn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) { statusOpen = !statusOpen; applyStatus(); }
              });
              closeBtn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) { toggle(); }
              });

              // ---- light body: checklist + live trade activity ----
              body = new LinearLayout(this);
              body.setOrientation(LinearLayout.VERTICAL);
              body.setPadding(dp(14), dp(8), dp(14), dp(14));
              checks = new LinearLayout(this);
              checks.setOrientation(LinearLayout.VERTICAL);
              body.addView(checks);

              View div = new View(this);
              div.setBackgroundColor(0x33FFFFFF);
              LinearLayout.LayoutParams dv = new LinearLayout.LayoutParams(-1, dp(1));
              dv.topMargin = dp(8);
              body.addView(div, dv);
              TextView lt = tv("LIVE TRADE ACTIVITY", 12, 0xFFE53935, true);
              lt.setLetterSpacing(0.1f);
              lt.setPadding(dp(2), dp(10), 0, dp(2));
              body.addView(lt);
              logList = new LinearLayout(this);
              logList.setOrientation(LinearLayout.VERTICAL);
              body.addView(logList);

              stopBtn = tv("Stop bot", 14, RED, true);
              stopBtn.setGravity(Gravity.CENTER);
              stopBtn.setPadding(dp(10), dp(10), dp(10), dp(10));
              stopBtn.setBackground(shape(0x00000000, 0, RED, 1));
              stopBtn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) {
                  if (!stopArmed) {
                    stopArmed = true;
                    stopBtn.setText("Tap again to stop the bot");
                    h.postDelayed(new Runnable() {
                      public void run() { stopArmed = false; stopBtn.setText("Stop bot"); }
                    }, 3000);
                    return;
                  }
                  stopArmed = false;
                  stopBtn.setText("Stop bot");
                  WebView w = MainActivity.web;
                  if (w != null) {
                    w.evaluateJavascript("try{state.robots.forEach(function(r){r.running=false});saveR();botCmd(false);keepAwake(false);render();}catch(e){}", null);
                  }
                }
              });

              int screenDp = (int) (getResources().getDisplayMetrics().heightPixels / getResources().getDisplayMetrics().density);
              bodyDp = Math.max(150, Math.min(300, screenDp - 40 - 6 - HEAD_DP - 70));
              bodySv = new ScrollView(this);
              bodySv.addView(body);
              bodySv.setVisibility(View.GONE);
              panel.addView(bodySv, new LinearLayout.LayoutParams(-1, dp(bodyDp)));

              panel.setVisibility(View.GONE);
              panelW = Math.min(dp(300), getResources().getDisplayMetrics().widthPixels - dp(16));
              LinearLayout.LayoutParams pl = new LinearLayout.LayoutParams(panelW, -2);
              pl.topMargin = dp(6);
              box.addView(panel, pl);

              lp = new WindowManager.LayoutParams(-2, -2,
                  Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                  PixelFormat.TRANSLUCENT);
              lp.gravity = Gravity.TOP | Gravity.START;
              DisplayMetrics dm0 = getResources().getDisplayMetrics();
              SharedPreferences pos = getSharedPreferences("pos", MODE_PRIVATE);
              lp.x = pos.getInt("x", (int) (dm0.widthPixels * 0.46f) - dp(20));
              lp.y = pos.getInt("y", (int) (dm0.heightPixels * 0.09f));

              bubble.setOnTouchListener(new View.OnTouchListener() {
                float dx, dy;
                int sx, sy;
                boolean moved;
                public boolean onTouch(View v, MotionEvent e) {
                  switch (e.getAction()) {
                    case MotionEvent.ACTION_DOWN:
                      sx = lp.x; sy = lp.y; dx = e.getRawX(); dy = e.getRawY(); moved = false;
                      return true;
                    case MotionEvent.ACTION_MOVE:
                      float mx = e.getRawX() - dx, my = e.getRawY() - dy;
                      if (Math.abs(mx) > dp(6) || Math.abs(my) > dp(6)) moved = true;
                      if (moved) {
                        lp.x = Math.max(0, sx + (int) mx);
                        lp.y = Math.max(0, sy + (int) my);
                        try { wm.updateViewLayout(box, lp); } catch (Exception ex) { }
                      }
                      return true;
                    case MotionEvent.ACTION_UP:
                      if (!moved) toggle();
                      else getSharedPreferences("pos", MODE_PRIVATE).edit().putInt("x", lp.x).putInt("y", lp.y).apply();
                      return true;
                  }
                  return false;
                }
              });
              box.setVisibility(View.VISIBLE);
              wm.addView(box, lp);
            }

            void setHeadBg() {
              // Pure dark – zero red
              GradientDrawable hg = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                  new int[] {0xFF1A1A1A, 0xFF121212, 0xFF0A0A0A, 0xFF050505});
              float r = dp(16);
              if (statusOpen) hg.setCornerRadii(new float[] {r, r, r, r, 0, 0, 0, 0});
              else hg.setCornerRadius(r);
              head.setBackground(hg);
            }

            void applyStatus() {
              bodySv.setVisibility(statusOpen ? View.VISIBLE : View.GONE);
              setHeadBg();
              if (statusOpen) { fillKey = ""; fill(System.currentTimeMillis() - lastPush > 15000); bodySv.scrollTo(0, 0); }
              clamp();
              try { wm.updateViewLayout(box, lp); } catch (Exception e) { }
            }

            void clamp() {
              DisplayMetrics m = getResources().getDisplayMetrics();
              int hgt = open ? dp(40 + 6 + HEAD_DP + (statusOpen ? bodyDp : 0)) : dp(40);
              int wid = open ? panelW : dp(40);
              if (lp.y + hgt > m.heightPixels) lp.y = Math.max(0, m.heightPixels - hgt);
              if (lp.x + wid > m.widthPixels) lp.x = Math.max(0, m.widthPixels - wid);
            }

            void toggle() {
              open = !open;
              panel.setVisibility(open ? View.VISIBLE : View.GONE);
              if (open && statusOpen) { fillKey = ""; fill(System.currentTimeMillis() - lastPush > 15000); }
              clamp();
              try { wm.updateViewLayout(box, lp); } catch (Exception e) { }
            }

            void parse(String j) {
              try {
                cur = new JSONObject(j);
                run = cur.optBoolean("run");
                conn = cur.optBoolean("conn");
                name = cur.optString("name", "ROBO EA");
                modeName = cur.optString("modeName", "");
                String im = cur.optString("img", "");
                if (im.startsWith("data:image")) imgData = im;
              } catch (Exception e) { cur = null; }
            }

            void refresh() {
              String j = latest;
              if (!j.equals(shown)) { shown = j; parse(j); }
              if (!run) {
                // bot not started: nothing floats over other apps
                if (added && box.getVisibility() != View.GONE) {
                  open = false;
                  statusOpen = false;
                  panel.setVisibility(View.GONE);
                  bodySv.setVisibility(View.GONE);
                  setHeadBg();
                  box.setVisibility(View.GONE);
                }
                return;
              }
              if (!added) ensureBubble();
              if (!added) return;
              if (box.getVisibility() != View.VISIBLE) box.setVisibility(View.VISIBLE);
              boolean stale = System.currentTimeMillis() - lastPush > 15000;
              if (srcBmp == null || srcHash != imgData.hashCode()) {
                srcHash = imgData.hashCode();
                srcBmp = null;
                if (imgData.length() > 0) {
                  try {
                    byte[] d = Base64.decode(imgData.substring(imgData.indexOf(',') + 1), Base64.DEFAULT);
                    srcBmp = BitmapFactory.decodeByteArray(d, 0, d.length);
                  } catch (Throwable t) { srcBmp = null; }
                }
                if (srcBmp == null) srcBmp = BitmapFactory.decodeResource(getResources(), R.mipmap.ic_launcher);
              }
              // ONLY pure transparent white candlesticks – no square, no circle, no border
              if (plugBmp != null && (ringKey == null || ringKey.isEmpty())) {
                ringKey = "white";
                bubble.setImageBitmap(transparentLogo(plugBmp, dp(40)));
              }
              if (avHash != srcHash && srcBmp != null) {
                avHash = srcHash;
                avatar.setImageBitmap(circle(srcBmp, dp(70), 0xFF222222));
              }
              String nm = name.toUpperCase(Locale.US);
              if (!nm.contentEquals(nameTv.getText())) nameTv.setText(nm);
              String md = modeName.length() > 0 ? modeName.toUpperCase(Locale.US) + " MODE" : "";
              if (!md.contentEquals(modeTv.getText())) modeTv.setText(md);
              if (open && statusOpen) fill(stale);
            }

            static Bitmap squareScaled(Bitmap src, int size) {
              int w = src.getWidth(), hh = src.getHeight(), m = Math.min(w, hh);
              Bitmap sq = Bitmap.createBitmap(src, (w - m) / 2, (hh - m) / 2, m, m);
              return Bitmap.createScaledBitmap(sq, size, size, true);
            }

            static Bitmap circle(Bitmap src, int size, int ring) {
              Bitmap out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
              Canvas c = new Canvas(out);
              float r = size / 2f, rw = size * 0.07f, cr = size * 0.2f;
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              p.setColor(0xFF111111);
              c.drawRect(0, 0, size, size, p);
              Bitmap sc = squareScaled(src, size);
              Paint sp = new Paint(Paint.ANTI_ALIAS_FLAG);
              sp.setShader(new BitmapShader(sc, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP));
              c.drawRect(rw, rw, size - rw, size - rw, sp);
              Paint rp = new Paint(Paint.ANTI_ALIAS_FLAG);
              rp.setStyle(Paint.Style.STROKE);
              rp.setStrokeWidth(rw);
              rp.setColor(ring);
              c.drawRect(rw / 2, rw / 2, size - rw / 2, size - rw / 2, rp);
              return out;
            }

            static String m(double v) { return Double.isNaN(v) ? "-" : String.format(Locale.US, "%.2f", v); }
            static String sgn(double v) { return Double.isNaN(v) ? "" : (v >= 0 ? "+" : "") + String.format(Locale.US, "%.2f", v); }
            static String px(double v) { return Double.isNaN(v) ? "-" : PX.format(v); }
            static int sideColor(String side) { return "BUY".equalsIgnoreCase(side) ? GREEN : RED; }

            boolean online() {
              try {
                ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                NetworkInfo ni = cm.getActiveNetworkInfo();
                return ni != null && ni.isConnected();
              } catch (Throwable t) { return true; }
            }

            LinearLayout checkRow(int st, String text, String detail) {
              LinearLayout w = new LinearLayout(this);
              w.setOrientation(LinearLayout.VERTICAL);
              w.setPadding(0, dp(7), 0, dp(7));
              LinearLayout r = new LinearLayout(this);
              r.setOrientation(LinearLayout.HORIZONTAL);
              r.setGravity(Gravity.CENTER_VERTICAL);
              String ic = st == 0 ? "\u2714" : (st == 1 ? "\u2716" : "\u25CF");
              int col = st == 0 ? GREEN : (st == 1 ? RED : AMBER);
              TextView i = tv(ic, 18, col, true);
              i.setGravity(Gravity.CENTER);
              r.addView(i, new LinearLayout.LayoutParams(dp(30), -2));
              TextView t = tv(text, 13, GREY, true);
              t.setGravity(Gravity.CENTER);
              r.addView(t, new LinearLayout.LayoutParams(0, -2, 1f));
              r.addView(new View(this), new LinearLayout.LayoutParams(dp(30), 1));
              w.addView(r);
              if (detail != null && detail.length() > 0) {
                TextView d = tv(detail, 11, 0xFF8A8F98, false);
                d.setGravity(Gravity.CENTER);
                w.addView(d);
              }
              return w;
            }

            void addLog(String tag, String detail, int color) {
              LinearLayout c = new LinearLayout(this);
              c.setOrientation(LinearLayout.VERTICAL);
              c.setPadding(dp(14), dp(9), dp(14), dp(9));
              c.setBackground(shape(0xFF161616, 0, 0xFF2A2A2A, 1));
              LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
              p.topMargin = dp(6);
              c.setLayoutParams(p);
              c.addView(tv(tag, 14, color, true));
              TextView d = tv(detail, 12, GREY, false);
              c.addView(d);
              logList.addView(c);
            }

            void buildLog(boolean stale) {
              logList.removeAllViews();
              if (cur == null) { addLog("WAITING", "Open ROBO EA once so the bot can report here.", AMBER); return; }
              if (!run) { addLog("BOT STOPPED", "Start the bot in the app to resume trading.", GREY); }
              JSONArray tr = cur.optJSONArray("trades"), sg = cur.optJSONArray("sigs"), sy = cur.optJSONArray("syms");
              HashSet<String> done = new HashSet<String>();
              ArrayList<JSONObject> closed = new ArrayList<JSONObject>();
              if (tr != null) for (int i = 0; i < tr.length(); i++) {
                JSONObject t = tr.optJSONObject(i);
                if (t == null) continue;
                String st = t.optString("st", "").toLowerCase(Locale.US);
                String side = t.optString("side", "").toUpperCase(Locale.US);
                String s = t.optString("s", "");
                if (st.equals("closed")) { closed.add(t); continue; }
                done.add(s);
                String note = t.optString("note", "");
                if (st.contains("pend") || st.contains("wait")) {
                  addLog("WAITING \u00B7 " + side + " " + s, "Pending order @ " + px(t.optDouble("entry")) + "  SL " + px(t.optDouble("sl")) + "  TP " + px(t.optDouble("tp")), AMBER);
                } else {
                  String lk = st.equals("locked") ? "  \uD83D\uDD12 profit locked" : "";
                  addLog("EXECUTING " + side + " \u00B7 " + s,
                      "Lot " + t.optString("lots") + "  Entry " + px(t.optDouble("entry")) + "  P/L " + sgn(t.optDouble("pl")) + lk + (note.length() > 0 ? "\n" + note : ""),
                      sideColor(side));
                }
              }
              if (sg != null) for (int i = 0; i < sg.length(); i++) {
                JSONObject s = sg.optJSONObject(i);
                if (s == null) continue;
                String sym = s.optString("s", "");
                if (done.contains(sym)) continue;
                String side = s.optString("side", "").toUpperCase(Locale.US);
                if ((side.equals("BUY") || side.equals("SELL")) && !Double.isNaN(s.optDouble("entry"))) {
                  done.add(sym);
                  addLog("EXECUTING " + side + " \u00B7 " + sym,
                      "Entry " + px(s.optDouble("entry")) + "  SL " + px(s.optDouble("sl")) + "  TP " + px(s.optDouble("tp")), sideColor(side));
                }
              }
              if (run) {
                ArrayList<String> all = new ArrayList<String>();
                if (sy != null) for (int i = 0; i < sy.length(); i++) all.add(sy.optString(i));
                if (sg != null) for (int i = 0; i < sg.length(); i++) { JSONObject s = sg.optJSONObject(i); if (s != null && !all.contains(s.optString("s"))) all.add(s.optString("s")); }
                for (String sym : all) {
                  if (sym.length() == 0 || done.contains(sym)) continue;
                  String why = "Scanning for a setup";
                  if (sg != null) for (int i = 0; i < sg.length(); i++) {
                    JSONObject s = sg.optJSONObject(i);
                    if (s != null && sym.equals(s.optString("s")) && s.optString("sig").length() > 0) why = s.optString("sig");
                  }
                  addLog("WAITING \u00B7 " + sym, why, AMBER);
                }
              }
              int n = 0;
              for (JSONObject t : closed) {
                if (n++ >= 4) break;
                String side = t.optString("side", "").toUpperCase(Locale.US);
                addLog("CLOSED " + side + " \u00B7 " + t.optString("s"), "P/L " + sgn(t.optDouble("pl")) + "  Entry " + px(t.optDouble("entry")), GREY);
              }
            }

            void fill(boolean stale) {
              boolean on = online();
              String key = shown.hashCode() + ":" + stale + ":" + on + ":" + run + ":" + open;
              if (key.equals(fillKey)) return;
              fillKey = key;

              nameTv.setText(name.toUpperCase(Locale.US));
              modeTv.setText(modeName.length() > 0 ? modeName.toUpperCase(Locale.US) + " MODE" : "");

              checks.removeAllViews();
              String login = cur == null ? "" : cur.optString("login", "");
              if (cur != null && conn) {
                String cu = cur.optString("cur", "");
                checks.addView(checkRow(0, "CONNECTED ACCOUNT" + (login.length() > 0 ? " \u00B7 " + login : ""),
                    "Balance " + m(cur.optDouble("bal")) + " " + cu + "   Equity " + m(cur.optDouble("eq")) + "   P/L " + sgn(cur.optDouble("pl"))));
              } else {
                checks.addView(checkRow(1, "ACCOUNT NOT CONNECTED", ""));
              }
              checks.addView(checkRow(on ? 0 : 1, on ? "INTERNET" : "NO INTERNET", ""));
              JSONArray sy = cur == null ? null : cur.optJSONArray("syms");
              StringBuilder sb = new StringBuilder();
              if (sy != null) for (int i = 0; i < sy.length(); i++) { if (i > 0) sb.append(", "); sb.append(sy.optString(i)); }
              checks.addView(checkRow(sb.length() > 0 ? 0 : 2, sb.length() > 0 ? sb.toString() : "NO SYMBOLS SELECTED", ""));
              if (cur == null) checks.addView(checkRow(2, "WAITING FOR THE APP", "Open ROBO EA once"));
              else if (!run) checks.addView(checkRow(1, "BOT STOPPED", ""));
              else if (stale) checks.addView(checkRow(2, "BOT ACTIVE \u00B7 NO UPDATES FROM APP", ""));
              else checks.addView(checkRow(0, "BOT ACTIVE", ""));

              buildLog(stale);
              if (stopBtn.getParent() != null) ((LinearLayout) stopBtn.getParent()).removeView(stopBtn);
              if (run) {
                LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(-1, -2);
                sp.topMargin = dp(12);
                logList.addView(stopBtn, sp);
              }
            }

            @Override
            public void onDestroy() {
              h.removeCallbacks(tick);
              try { if (added) wm.removeView(box); } catch (Exception e) { }
              try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) { }
              super.onDestroy();
            }
          }
          ROBOEOF
          cat > app/src/main/assets/inject.js <<'ROBOEOF'
          (function(){
            if(window.__roboHook) return; window.__roboHook=true;
            var n=0, lastImg="";
            function num(v){ v=+v; return isFinite(v)?v:null; }
            function symsOf(r0){
              var out=[];
              function add(x){
                if(x==null) return;
                if(typeof x==="string"){ x.split(/[,;\s]+/).forEach(function(p){ if(p&&out.indexOf(p)<0) out.push(p); }); }
                else if(Array.isArray(x)){ x.forEach(add); }
                else if(typeof x==="object"){ add(x.symbol||x.name||x.s); }
              }
              add(r0.symbols); add(r0.symbol); add(r0.syms); add(state.symbols);
              if(!out.length) Object.keys(state.symInfo||{}).forEach(add);
              return out.slice(0,12);
            }
            function snap(){
              try{
                if(typeof state==="undefined"||!window.RoboNative) return;
                var r0=(state.robots||[])[0]||{}, b=r0.bot||{}, a=state.acct||{};
                var trades=(state.trades||[]).slice(0,30).map(function(t){ return {s:t.symbol,side:t.side,lots:t.lots,entry:num(t.entry),sl:num(t.sl),tp:num(t.tp),pl:num(t.profit),st:t.status,note:t.note||""}; });
                var sigs=[], si=state.symInfo||{};
                Object.keys(si).forEach(function(k){ var i=si[k]; if(i&&i.signal){ var pl=i.plan||{}; sigs.push({s:k,sig:String(i.signal),side:pl.side||"",entry:num(pl.entry),sl:num(pl.sl),tp:num(pl.tp)}); } });
                var img=(typeof b.img==="string"&&b.img.indexOf("data:image")===0&&b.img.length<400000)?b.img:"";
                var sendImg=(img&&(img!==lastImg||n%30===0))?img:""; if(img) lastImg=img; n++;
                var md=(typeof MODES!=="undefined"&&MODES[r0.mode||"normal"])||{};
                window.RoboNative.push(JSON.stringify({run:!!state.running,name:b.name||"ROBO EA",img:sendImg,cur:a.currency||"",bal:num(a.balance),eq:num(a.equity),pl:num(a.profit),conn:!!state.acct,login:String(a.login||a.account||a.number||""),syms:symsOf(r0),mode:r0.mode||"normal",modeName:md.n||"",modeDesc:md.d||"",color:typeof b.color==="string"?b.color:"",trades:trades,sigs:sigs.slice(0,8)}));
              }catch(e){}
            }
            setInterval(snap,2000); snap();
          })();
          ROBOEOF
          cat > app/src/main/assets/plug.b64 <<'ROBOEOF'
          
          ROBOEOF
          U="$APP_URL"
          case "$U" in http*) ;; *) U="https://$U" ;; esac
          printf '%s' "$U" > app/src/main/assets/url.txt
          echo "Site: $U"
          curl -fsSL --max-time 30 "${U%/}/icon-512.png" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          python3 - <<'PYEOF2'
          import struct, zlib
          p = "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          sig = b"\x89PNG\r\n\x1a\n"
          try:
              ok = open(p, "rb").read(8) == sig
          except Exception:
              ok = False
          if not ok:
              print("No site icon found, using a plain green icon")
              n = 192
              raw = b"".join(b"\x00" + bytes([45, 255, 160, 255]) * n for _ in range(n))
              def ch(t, d):
                  c = struct.pack(">I", len(d)) + t + d
                  return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              png = sig + ch(b"IHDR", struct.pack(">IIBBBBB", n, n, 8, 6, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw)) + ch(b"IEND", b"")
              open(p, "wb").write(png)
          PYEOF2
          find . -type f | sort
      - name: Build the APK
        working-directory: robo
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp robo/app/build/outputs/apk/debug/app-debug.apk ROBO-EA.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ROBO EA app ${{ github.run_number }}
