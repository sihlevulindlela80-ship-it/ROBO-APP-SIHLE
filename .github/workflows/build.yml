name: Build ROBO EA APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your ROBO EA website address (the Netlify link)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event.inputs.site_url }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create the Android project
        run: |
          set -e
          mkdir -p robo/app/src/main/java/com/roboea/app robo/app/src/main/assets robo/app/src/main/res/mipmap-xxxhdpi
          cd robo
          cat > settings.gradle <<'ROBOEOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "roboea"
          include ':app'
          ROBOEOF
          cat > build.gradle <<'ROBOEOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
          }
          ROBOEOF
          cat > gradle.properties <<'ROBOEOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          ROBOEOF
          cat > app/build.gradle <<'ROBOEOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.roboea.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.roboea.app'
              minSdk 24
              targetSdk 33
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          ROBOEOF
          cat > app/src/main/AndroidManifest.xml <<'ROBOEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
            <application
                android:label="ROBO EA"
                android:icon="@mipmap/ic_launcher"
                android:allowBackup="false"
                android:usesCleartextTraffic="false"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:launchMode="singleTask"
                  android:configChanges="orientation|screenSize|keyboardHidden|keyboard|screenLayout|smallestScreenSize|uiMode|density|fontScale"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <service android:name=".BotService" android:exported="false" />
            </application>
          </manifest>
          ROBOEOF
          cat > app/src/main/java/com/roboea/app/MainActivity.java <<'ROBOEOF'
          package com.roboea.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.MutableContextWrapper;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          public class MainActivity extends Activity {
            static WebView web;
            static MutableContextWrapper wrap;
            static MainActivity current;
            static volatile boolean visible = false;
            static ValueCallback<Uri[]> fileCb;
            static String host = "";
            FrameLayout root;
            boolean askedOverlay = false, askedBatt = false;

            public static class Bridge {
              @JavascriptInterface
              public void push(String j) { BotService.update(j); }
            }

            static String readAsset(Context c, String n) {
              try {
                InputStream in = c.getAssets().open(n);
                ByteArrayOutputStream o = new ByteArrayOutputStream();
                byte[] b = new byte[4096];
                int k;
                while ((k = in.read(b)) > 0) o.write(b, 0, k);
                in.close();
                return o.toString("UTF-8");
              } catch (Exception e) { return ""; }
            }

            void makeWeb() {
              wrap = new MutableContextWrapper(getApplicationContext());
              web = new WebView(wrap);
              web.setBackgroundColor(0xFF000000);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(false);
              CookieManager.getInstance().setAcceptCookie(true);
              String url = readAsset(this, "url.txt").trim();
              try { host = Uri.parse(url).getHost(); } catch (Exception e) { host = ""; }
              web.addJavascriptInterface(new Bridge(), "RoboNative");
              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  String h = u.getHost();
                  if (h != null && h.equals(host)) return false;
                  String sc = u.getScheme();
                  if ("http".equals(sc) || "https".equals(sc) || "tel".equals(sc) || "mailto".equals(sc)) {
                    try {
                      Intent i = new Intent(Intent.ACTION_VIEW, u);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      v.getContext().getApplicationContext().startActivity(i);
                    } catch (Exception e) { }
                  }
                  return true;
                }
                @Override
                public void onPageFinished(WebView v, String u) {
                  v.evaluateJavascript(readAsset(v.getContext().getApplicationContext(), "inject.js"), null);
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  MainActivity a = current;
                  if (a == null) return false;
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  try {
                    a.startActivityForResult(p.createIntent(), 11);
                  } catch (Exception e) {
                    fileCb = null;
                    return false;
                  }
                  return true;
                }
              });
              web.loadUrl(url);
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              current = this;
              getWindow().setStatusBarColor(0xFF000000);
              getWindow().setNavigationBarColor(0xFF000000);
              root = new FrameLayout(this);
              root.setBackgroundColor(0xFF000000);
              setContentView(root);
              if (web == null) makeWeb();
              wrap.setBaseContext(this);
              ViewGroup p = (ViewGroup) web.getParent();
              if (p != null) p.removeView(web);
              root.addView(web, new FrameLayout.LayoutParams(-1, -1));
              startBot();
              if (Build.VERSION.SDK_INT >= 33
                  && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[] {"android.permission.POST_NOTIFICATIONS"}, 21);
              }
            }

            void startBot() {
              Intent i = new Intent(this, BotService.class);
              if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
            }

            @Override
            protected void onResume() {
              super.onResume();
              visible = true;
              web.resumeTimers();
              startBot();
              if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this) && !askedOverlay) {
                askedOverlay = true;
                new AlertDialog.Builder(this)
                    .setTitle("Floating robot")
                    .setMessage("Allow \"Display over other apps\" so the round robot can float over other apps and show your trades.")
                    .setPositiveButton("Allow", (d, w) -> startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()))))
                    .setNegativeButton("Not now", null)
                    .show();
              } else if (Build.VERSION.SDK_INT >= 23 && !askedBatt) {
                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                if (!pm.isIgnoringBatteryOptimizations(getPackageName())) {
                  askedBatt = true;
                  new AlertDialog.Builder(this)
                      .setTitle("Keep trading in the background")
                      .setMessage("Allow ROBO EA to run without battery limits so the phone does not freeze the bot when the screen is off.")
                      .setPositiveButton("Allow", (d, w) -> startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName()))))
                      .setNegativeButton("Not now", null)
                      .show();
                }
              }
            }

            @Override
            protected void onPause() {
              super.onPause();
              visible = false;
              if (web != null) web.resumeTimers();
            }

            @Override
            protected void onStop() {
              super.onStop();
              if (web != null) web.resumeTimers();
            }

            @Override
            protected void onActivityResult(int rq, int rs, Intent d) {
              if (rq == 11) {
                if (fileCb != null) {
                  fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d));
                  fileCb = null;
                }
                return;
              }
              super.onActivityResult(rq, rs, d);
            }

            @Override
            public void onBackPressed() {
              if (web != null && web.canGoBack()) web.goBack(); else moveTaskToBack(true);
            }

            @Override
            protected void onDestroy() {
              current = null;
              visible = false;
              try { root.removeView(web); } catch (Exception e) { }
              if (wrap != null) wrap.setBaseContext(getApplicationContext());
              super.onDestroy();
            }
          }
          ROBOEOF
          cat > app/src/main/java/com/roboea/app/BotService.java <<'ROBOEOF'
          package com.roboea.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.BitmapShader;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.text.DecimalFormat;
          import java.text.DecimalFormatSymbols;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BotService extends Service {
            static volatile String latest = "";
            static volatile long lastPush = 0;

            static void update(String j) {
              latest = j;
              lastPush = System.currentTimeMillis();
            }

            static final DecimalFormat PX = new DecimalFormat("0.#####", DecimalFormatSymbols.getInstance(Locale.US));

            WindowManager wm;
            LinearLayout box, panel, tradeList, extra, bar;
            ScrollView tradeSv, extraSv;
            ImageView bubble, pic;
            TextView nameTv, modeTv, closeBtn, gridBtn, stBtn, mdBtn, stopBtn;
            WindowManager.LayoutParams lp;
            Handler h = new Handler(Looper.getMainLooper());
            PowerManager.WakeLock wl;
            boolean open = false, added = false, run = false, conn = false, stopArmed = false;
            int view = 0, panelW = 0, accent = 0xFF2DFFA0, domColor = 0, srcHash = -1;
            String shown = "", imgKey = "", imgData = "", name = "ROBO EA", colorStr = "", modeName = "", modeDesc = "";
            Bitmap srcBmp;
            JSONObject cur = null;

            Runnable tick = new Runnable() {
              public void run() {
                try { refresh(); } catch (Throwable t) { }
                h.postDelayed(this, 1500);
              }
            };

            int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density + 0.5f); }

            @Override
            public IBinder onBind(Intent i) { return null; }

            @Override
            public void onCreate() {
              super.onCreate();
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel("roboea", "ROBO EA running", NotificationManager.IMPORTANCE_LOW);
                ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
              }
              PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
              wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "roboea:bot");
              wl.setReferenceCounted(false);
              wl.acquire();
              h.post(tick);
            }

            @Override
            public int onStartCommand(Intent in, int flags, int id) {
              Intent oi = new Intent(this, MainActivity.class);
              oi.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
              PendingIntent pi = PendingIntent.getActivity(this, 0, oi,
                  PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));
              Notification.Builder nb = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "roboea") : new Notification.Builder(this);
              Notification n = nb.setContentTitle("ROBO EA is running")
                  .setContentText("Tap to open. Trades are managed in the background.")
                  .setSmallIcon(android.R.drawable.ic_dialog_info)
                  .setContentIntent(pi)
                  .setOngoing(true)
                  .build();
              startForeground(1, n);
              ensureBubble();
              return START_STICKY;
            }

            void ensureBubble() {
              if (added) return;
              if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) return;
              try {
                build();
                added = true;
              } catch (Throwable t) { added = false; }
            }

            TextView tv(String s, int sp, int color, boolean bold) {
              TextView t = new TextView(this);
              t.setText(s);
              t.setTextSize(sp);
              t.setTextColor(color);
              if (bold) t.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              return t;
            }

            TextView pill(String s) {
              TextView t = tv(s, 15, 0xFFFFFFFF, true);
              t.setGravity(Gravity.CENTER);
              t.setPadding(dp(10), dp(12), dp(10), dp(12));
              return t;
            }

            static int blend(int a, int b, float t) {
              int r = (int) (Color.red(a) * (1 - t) + Color.red(b) * t);
              int g = (int) (Color.green(a) * (1 - t) + Color.green(b) * t);
              int bl = (int) (Color.blue(a) * (1 - t) + Color.blue(b) * t);
              return Color.rgb(r, g, bl);
            }

            GradientDrawable shape(int color, int radiusDp, int strokeColor, int strokeDp) {
              GradientDrawable g = new GradientDrawable();
              g.setColor(color);
              g.setCornerRadius(dp(radiusDp));
              if (strokeDp > 0) g.setStroke(dp(strokeDp), strokeColor);
              return g;
            }

            void applyAccent() {
              if (panel == null) return;
              int bg = (blend(0xFF0A0C10, accent, 0.30f) & 0x00FFFFFF) | 0xEB000000;
              panel.setBackground(shape(bg, 30, (accent & 0x00FFFFFF) | 0xAA000000, 2));
              bar.setBackground(shape(0x66000000, 34, (accent & 0x00FFFFFF) | 0x77000000, 1));
              GradientDrawable cg = new GradientDrawable();
              cg.setColor(0x33FFFFFF);
              cg.setShape(GradientDrawable.OVAL);
              closeBtn.setBackground(cg);
              modeTv.setTextColor(accent);
              stBtn.setTextColor(view == 1 ? accent : 0xFFFFFFFF);
              mdBtn.setTextColor(view == 2 ? accent : 0xFFFFFFFF);
              gridBtn.setTextColor(accent);
              stopBtn.setBackground(shape(0x33000000, 12, 0xFFFF5470, 1));
            }

            void build() {
              wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL);
              bubble = new ImageView(this);
              box.addView(bubble, new LinearLayout.LayoutParams(dp(62), dp(62)));

              panel = new LinearLayout(this);
              panel.setOrientation(LinearLayout.VERTICAL);
              panel.setPadding(dp(14), dp(10), dp(14), dp(12));

              LinearLayout top = new LinearLayout(this);
              top.setOrientation(LinearLayout.HORIZONTAL);
              View sp = new View(this);
              top.addView(sp, new LinearLayout.LayoutParams(0, 1, 1f));
              closeBtn = tv("\u2715", 16, 0xFFFFFFFF, true);
              closeBtn.setGravity(Gravity.CENTER);
              top.addView(closeBtn, new LinearLayout.LayoutParams(dp(40), dp(40)));
              closeBtn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) { toggle(); }
              });
              panel.addView(top);

              tradeSv = new ScrollView(this);
              tradeList = new LinearLayout(this);
              tradeList.setOrientation(LinearLayout.VERTICAL);
              tradeSv.addView(tradeList);
              panel.addView(tradeSv, new LinearLayout.LayoutParams(-1, dp(132)));

              pic = new ImageView(this);
              LinearLayout.LayoutParams pp = new LinearLayout.LayoutParams(dp(118), dp(118));
              pp.gravity = Gravity.CENTER_HORIZONTAL;
              pp.topMargin = dp(12);
              panel.addView(pic, pp);

              nameTv = tv("ROBO EA", 16, 0xFFFFFFFF, false);
              nameTv.setGravity(Gravity.CENTER);
              nameTv.setSingleLine(true);
              nameTv.setEllipsize(android.text.TextUtils.TruncateAt.END);
              LinearLayout.LayoutParams np = new LinearLayout.LayoutParams(-1, -2);
              np.topMargin = dp(8);
              panel.addView(nameTv, np);
              modeTv = tv("", 18, accent, true);
              modeTv.setGravity(Gravity.CENTER);
              modeTv.setSingleLine(true);
              panel.addView(modeTv, new LinearLayout.LayoutParams(-1, -2));

              extraSv = new ScrollView(this);
              extra = new LinearLayout(this);
              extra.setOrientation(LinearLayout.VERTICAL);
              extraSv.addView(extra);
              LinearLayout.LayoutParams ep = new LinearLayout.LayoutParams(-1, dp(120));
              ep.topMargin = dp(8);
              extraSv.setVisibility(View.GONE);
              panel.addView(extraSv, ep);

              bar = new LinearLayout(this);
              bar.setOrientation(LinearLayout.HORIZONTAL);
              bar.setGravity(Gravity.CENTER_VERTICAL);
              bar.setPadding(dp(8), dp(4), dp(8), dp(4));
              gridBtn = pill("\u25A6");
              gridBtn.setTextSize(22);
              stBtn = pill("STATUS");
              mdBtn = pill("MODE");
              bar.addView(gridBtn, new LinearLayout.LayoutParams(dp(54), -2));
              LinearLayout.LayoutParams bl = new LinearLayout.LayoutParams(0, -2, 1f);
              bar.addView(stBtn, bl);
              bar.addView(mdBtn, new LinearLayout.LayoutParams(0, -2, 1f));
              LinearLayout.LayoutParams barp = new LinearLayout.LayoutParams(-1, -2);
              barp.topMargin = dp(12);
              panel.addView(bar, barp);
              gridBtn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) {
                  Intent i = new Intent(BotService.this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  startActivity(i);
                }
              });
              stBtn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) { setView(view == 1 ? 0 : 1); }
              });
              mdBtn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) { setView(view == 2 ? 0 : 2); }
              });

              stopBtn = tv("Stop bot", 14, 0xFFFF5470, true);
              stopBtn.setGravity(Gravity.CENTER);
              stopBtn.setPadding(dp(10), dp(10), dp(10), dp(10));
              stopBtn.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) {
                  if (!stopArmed) {
                    stopArmed = true;
                    stopBtn.setText("Tap again to stop the bot");
                    h.postDelayed(new Runnable() {
                      public void run() { stopArmed = false; stopBtn.setText("Stop bot"); }
                    }, 3000);
                    return;
                  }
                  stopArmed = false;
                  stopBtn.setText("Stop bot");
                  WebView w = MainActivity.web;
                  if (w != null) {
                    w.evaluateJavascript("try{state.robots.forEach(function(r){r.running=false});saveR();botCmd(false);keepAwake(false);render();}catch(e){}", null);
                  }
                }
              });

              panel.setVisibility(View.GONE);
              panelW = Math.min(dp(340), getResources().getDisplayMetrics().widthPixels - dp(16));
              LinearLayout.LayoutParams pl = new LinearLayout.LayoutParams(panelW, -2);
              pl.topMargin = dp(6);
              box.addView(panel, pl);
              applyAccent();

              lp = new WindowManager.LayoutParams(-2, -2,
                  Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                  PixelFormat.TRANSLUCENT);
              lp.gravity = Gravity.TOP | Gravity.START;
              lp.x = dp(8);
              lp.y = dp(160);

              bubble.setOnTouchListener(new View.OnTouchListener() {
                float dx, dy;
                int sx, sy;
                boolean moved;
                public boolean onTouch(View v, MotionEvent e) {
                  switch (e.getAction()) {
                    case MotionEvent.ACTION_DOWN:
                      sx = lp.x; sy = lp.y; dx = e.getRawX(); dy = e.getRawY(); moved = false;
                      return true;
                    case MotionEvent.ACTION_MOVE:
                      float mx = e.getRawX() - dx, my = e.getRawY() - dy;
                      if (Math.abs(mx) > dp(6) || Math.abs(my) > dp(6)) moved = true;
                      if (moved) {
                        lp.x = Math.max(0, sx + (int) mx);
                        lp.y = Math.max(0, sy + (int) my);
                        try { wm.updateViewLayout(box, lp); } catch (Exception ex) { }
                      }
                      return true;
                    case MotionEvent.ACTION_UP:
                      if (!moved) toggle();
                      return true;
                  }
                  return false;
                }
              });
              wm.addView(box, lp);
            }

            void clamp() {
              DisplayMetrics m = getResources().getDisplayMetrics();
              int hgt = open ? dp(62 + 6 + (view == 0 ? 450 : 575)) : dp(62);
              int wid = open ? panelW : dp(62);
              if (lp.y + hgt > m.heightPixels) lp.y = Math.max(0, m.heightPixels - hgt);
              if (lp.x + wid > m.widthPixels) lp.x = Math.max(0, m.widthPixels - wid);
            }

            void setView(int v) {
              view = v;
              extraSv.setVisibility(v == 0 ? View.GONE : View.VISIBLE);
              stBtn.setTextColor(v == 1 ? accent : 0xFFFFFFFF);
              mdBtn.setTextColor(v == 2 ? accent : 0xFFFFFFFF);
              fill(System.currentTimeMillis() - lastPush > 15000);
              clamp();
              try { wm.updateViewLayout(box, lp); } catch (Exception e) { }
            }

            void toggle() {
              open = !open;
              panel.setVisibility(open ? View.VISIBLE : View.GONE);
              if (open) { fill(System.currentTimeMillis() - lastPush > 15000); }
              clamp();
              try { wm.updateViewLayout(box, lp); } catch (Exception e) { }
            }

            void parse(String j) {
              try {
                cur = new JSONObject(j);
                run = cur.optBoolean("run");
                conn = cur.optBoolean("conn");
                name = cur.optString("name", "ROBO EA");
                colorStr = cur.optString("color", "");
                modeName = cur.optString("modeName", "");
                modeDesc = cur.optString("modeDesc", "");
                String im = cur.optString("img", "");
                if (im.startsWith("data:image")) imgData = im;
              } catch (Exception e) { cur = null; }
            }

            static int dominant(Bitmap b) {
              try {
                Bitmap s = Bitmap.createScaledBitmap(b, 24, 24, true);
                float[] hsv = new float[3];
                double r = 0, g = 0, bl = 0, ws = 0;
                for (int x = 0; x < 24; x++) {
                  for (int y = 0; y < 24; y++) {
                    int c = s.getPixel(x, y);
                    Color.colorToHSV(c, hsv);
                    double w = hsv[1] * hsv[2];
                    w = w * w;
                    r += Color.red(c) * w; g += Color.green(c) * w; bl += Color.blue(c) * w; ws += w;
                  }
                }
                if (ws < 0.0001) return 0xFF2DFFA0;
                int c = Color.rgb((int) (r / ws), (int) (g / ws), (int) (bl / ws));
                Color.colorToHSV(c, hsv);
                hsv[1] = Math.max(hsv[1], 0.6f);
                hsv[2] = Math.max(hsv[2], 0.85f);
                return Color.HSVToColor(hsv);
              } catch (Throwable t) { return 0xFF2DFFA0; }
            }

            void refresh() {
              if (!added) ensureBubble();
              if (!added) return;
              boolean hide = MainActivity.visible;
              box.setVisibility(hide ? View.GONE : View.VISIBLE);
              if (hide && open) { open = false; panel.setVisibility(View.GONE); }
              boolean stale = System.currentTimeMillis() - lastPush > 15000;
              String j = latest;
              if (!j.equals(shown)) { shown = j; parse(j); }
              if (srcBmp == null || srcHash != imgData.hashCode()) {
                srcHash = imgData.hashCode();
                srcBmp = null;
                if (imgData.length() > 0) {
                  try {
                    byte[] d = Base64.decode(imgData.substring(imgData.indexOf(',') + 1), Base64.DEFAULT);
                    srcBmp = BitmapFactory.decodeByteArray(d, 0, d.length);
                  } catch (Throwable t) { srcBmp = null; }
                }
                if (srcBmp == null) srcBmp = BitmapFactory.decodeResource(getResources(), R.mipmap.ic_launcher);
                domColor = srcBmp == null ? 0xFF2DFFA0 : dominant(srcBmp);
                imgKey = "";
              }
              int na = 0;
              if (colorStr.length() > 0) { try { na = Color.parseColor(colorStr); } catch (Exception e) { na = 0; } }
              if (na == 0) na = domColor;
              na = na | 0xFF000000;
              if (na != accent) { accent = na; applyAccent(); imgKey = ""; }
              int ring = !run ? 0xFF8A8F98 : (stale ? 0xFFFFB020 : accent);
              String key = ring + ":" + srcHash + ":" + accent;
              if (!key.equals(imgKey) && srcBmp != null) {
                imgKey = key;
                bubble.setImageBitmap(circle(srcBmp, dp(62), ring));
                pic.setImageBitmap(rounded(srcBmp, dp(118), dp(24), accent));
              }
              if (open) fill(stale);
            }

            static Bitmap squareScaled(Bitmap src, int size) {
              int w = src.getWidth(), hh = src.getHeight(), m = Math.min(w, hh);
              Bitmap sq = Bitmap.createBitmap(src, (w - m) / 2, (hh - m) / 2, m, m);
              return Bitmap.createScaledBitmap(sq, size, size, true);
            }

            static Bitmap circle(Bitmap src, int size, int ring) {
              Bitmap out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
              Canvas c = new Canvas(out);
              float r = size / 2f, rw = size * 0.07f;
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              p.setColor(0xFF111111);
              c.drawCircle(r, r, r, p);
              Bitmap sc = squareScaled(src, size);
              Paint sp = new Paint(Paint.ANTI_ALIAS_FLAG);
              sp.setShader(new BitmapShader(sc, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP));
              c.drawCircle(r, r, r - rw, sp);
              Paint rp = new Paint(Paint.ANTI_ALIAS_FLAG);
              rp.setStyle(Paint.Style.STROKE);
              rp.setStrokeWidth(rw);
              rp.setColor(ring);
              c.drawCircle(r, r, r - rw / 2, rp);
              return out;
            }

            static Bitmap rounded(Bitmap src, int size, float rad, int ring) {
              Bitmap out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
              Canvas c = new Canvas(out);
              float rw = size * 0.025f;
              Bitmap sc = squareScaled(src, size);
              Paint sp = new Paint(Paint.ANTI_ALIAS_FLAG);
              sp.setShader(new BitmapShader(sc, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP));
              c.drawRoundRect(new RectF(rw, rw, size - rw, size - rw), rad, rad, sp);
              Paint rp = new Paint(Paint.ANTI_ALIAS_FLAG);
              rp.setStyle(Paint.Style.STROKE);
              rp.setStrokeWidth(rw);
              rp.setColor((ring & 0x00FFFFFF) | 0xCC000000);
              c.drawRoundRect(new RectF(rw / 2, rw / 2, size - rw / 2, size - rw / 2), rad, rad, rp);
              return out;
            }

            static String m(double v) { return Double.isNaN(v) ? "-" : String.format(Locale.US, "%.2f", v); }
            static String sgn(double v) { return Double.isNaN(v) ? "" : (v >= 0 ? "+" : "") + String.format(Locale.US, "%.2f", v); }
            static String px(double v) { return Double.isNaN(v) ? "-" : PX.format(v); }
            static int sideColor(String side) { return "BUY".equalsIgnoreCase(side) ? 0xFF2DFFA0 : 0xFFFF5470; }

            LinearLayout card() {
              LinearLayout c = new LinearLayout(this);
              c.setOrientation(LinearLayout.VERTICAL);
              c.setPadding(dp(16), dp(10), dp(16), dp(10));
              c.setBackground(shape(0x66000000, 22, (accent & 0x00FFFFFF) | 0x66000000, 1));
              LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
              p.topMargin = dp(6);
              c.setLayoutParams(p);
              return c;
            }

            LinearLayout row(TextView l, TextView r) {
              LinearLayout rw = new LinearLayout(this);
              rw.setOrientation(LinearLayout.HORIZONTAL);
              rw.addView(l, new LinearLayout.LayoutParams(0, -2, 1f));
              rw.addView(r, new LinearLayout.LayoutParams(-2, -2));
              return rw;
            }

            void fill(boolean stale) {
              int openN = 0;
              JSONArray tr = cur == null ? null : cur.optJSONArray("trades");
              if (tr != null) for (int i = 0; i < tr.length(); i++) {
                JSONObject t = tr.optJSONObject(i);
                if (t != null && !"closed".equals(t.optString("st"))) openN++;
              }
              nameTv.setText(name);
              modeTv.setText(modeName.length() > 0 ? modeName.toUpperCase(Locale.US) + " MODE" : "");
              String statusTxt = cur == null ? "Waiting for the app. Open ROBO EA once."
                  : (stale ? "No updates from the app" : (!run ? "Bot is stopped" : (openN > 0 ? "Managing " + openN + " open trade" + (openN > 1 ? "s" : "") : "Watching markets")));

              tradeList.removeAllViews();
              int shownN = 0;
              if (tr != null) for (int i = 0; i < tr.length(); i++) {
                JSONObject t = tr.optJSONObject(i);
                if (t != null && !"closed".equals(t.optString("st"))) { addTrade(t); shownN++; }
              }
              if (shownN == 0) {
                LinearLayout c = card();
                c.addView(tv("No open trade", 16, 0xFFFFFFFF, true));
                c.addView(tv(statusTxt, 13, 0xFFC5CAD1, false));
                tradeList.addView(c);
              }

              if (view != 0) {
                extra.removeAllViews();
                if (view == 1) {
                  String c = cur == null ? "" : cur.optString("cur", "");
                  TextView st = tv(statusTxt, 15, stale ? 0xFFFFB020 : 0xFFFFFFFF, true);
                  extra.addView(st);
                  if (cur != null && conn) extra.addView(tv("Balance " + m(cur.optDouble("bal")) + " " + c + "\nEquity " + m(cur.optDouble("eq")) + "   \u00B7   P/L " + sgn(cur.optDouble("pl")), 13, 0xFFE6E8EB, false));
                  else if (cur != null) extra.addView(tv("MetaTrader account not connected", 13, 0xFFE6E8EB, false));
                  JSONArray sg = cur == null ? null : cur.optJSONArray("sigs");
                  if (sg != null) for (int i = 0; i < sg.length(); i++) {
                    JSONObject s = sg.optJSONObject(i);
                    if (s == null) continue;
                    String side = s.optString("side", "");
                    String line = s.optString("s") + " \u00B7 " + s.optString("sig");
                    if (side.length() > 0 && !"null".equals(side) && !Double.isNaN(s.optDouble("entry"))) line = s.optString("s") + " " + side.toUpperCase(Locale.US) + " \u00B7 Entry " + px(s.optDouble("entry")) + " \u00B7 SL " + px(s.optDouble("sl")) + " \u00B7 TP " + px(s.optDouble("tp"));
                    TextView sl = tv(line, 12, 0xFFC5CAD1, false);
                    sl.setPadding(0, dp(4), 0, 0);
                    extra.addView(sl);
                  }
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(-1, -2);
                  sp.topMargin = dp(8);
                  extra.addView(stopBtn, sp);
                } else {
                  extra.addView(tv(modeName.length() > 0 ? modeName : "Mode", 15, accent, true));
                  TextView d = tv(modeDesc.length() > 0 ? modeDesc : "Open the app to change the mode.", 12, 0xFFE6E8EB, false);
                  d.setPadding(0, dp(4), 0, 0);
                  extra.addView(d);
                }
              }
            }

            void addTrade(JSONObject t) {
              LinearLayout c = card();
              String side = t.optString("side").toUpperCase(Locale.US);
              c.addView(row(tv(side + " " + t.optString("s"), 17, sideColor(side), true), tv("Lot " + t.optString("lots"), 14, 0xFFFFFFFF, false)));
              double sl = t.optDouble("sl"), tp = t.optDouble("tp");
              boolean locked = "locked".equals(t.optString("st"));
              TextView slv = tv("SL: " + ((Double.isNaN(sl) || sl <= 0) ? "-" : px(sl)), 14, locked ? 0xFF2DFFA0 : 0xFFFF5470, true);
              TextView tpv = tv("TP: " + ((Double.isNaN(tp) || tp <= 0) ? "-" : px(tp)), 14, 0xFFFFFFFF, true);
              c.addView(row(slv, tpv));
              double pl = t.optDouble("pl");
              TextView plv = tv("P/L " + sgn(pl), 13, (Double.isNaN(pl) || pl >= 0) ? 0xFF2DFFA0 : 0xFFFF5470, true);
              TextView ent = tv("Entry " + px(t.optDouble("entry")) + (locked ? "   \uD83D\uDD12 profit locked" : ""), 12, 0xFFC5CAD1, false);
              c.addView(row(ent, plv));
              tradeList.addView(c);
            }

            @Override
            public void onDestroy() {
              h.removeCallbacks(tick);
              try { if (added) wm.removeView(box); } catch (Exception e) { }
              try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) { }
              super.onDestroy();
            }
          }
          ROBOEOF
          cat > app/src/main/assets/inject.js <<'ROBOEOF'
          (function(){
            if(window.__roboHook) return; window.__roboHook=true;
            var n=0, lastImg="";
            function num(v){ v=+v; return isFinite(v)?v:null; }
            function snap(){
              try{
                if(typeof state==="undefined"||!window.RoboNative) return;
                var r0=(state.robots||[])[0]||{}, b=r0.bot||{}, a=state.acct||{};
                var trades=(state.trades||[]).slice(0,30).map(function(t){ return {s:t.symbol,side:t.side,lots:t.lots,entry:num(t.entry),sl:num(t.sl),tp:num(t.tp),pl:num(t.profit),st:t.status,note:t.note||""}; });
                var sigs=[], si=state.symInfo||{};
                Object.keys(si).forEach(function(k){ var i=si[k]; if(i&&i.signal){ var pl=i.plan||{}; sigs.push({s:k,sig:String(i.signal),side:pl.side||"",entry:num(pl.entry),sl:num(pl.sl),tp:num(pl.tp)}); } });
                var img=(typeof b.img==="string"&&b.img.indexOf("data:image")===0&&b.img.length<400000)?b.img:"";
                var sendImg=(img&&(img!==lastImg||n%30===0))?img:""; if(img) lastImg=img; n++;
                window.RoboNative.push(JSON.stringify({run:!!state.running,name:b.name||"ROBO EA",img:sendImg,cur:a.currency||"",bal:num(a.balance),eq:num(a.equity),pl:num(a.profit),conn:!!state.acct,mode:r0.mode||"normal",modeName:((typeof MODES!=="undefined"&&MODES[r0.mode||"normal"])||{}).n||"",modeDesc:((typeof MODES!=="undefined"&&MODES[r0.mode||"normal"])||{}).d||"",color:typeof b.color==="string"?b.color:"",trades:trades,sigs:sigs.slice(0,8)}));
              }catch(e){}
            }
            setInterval(snap,2000); snap();
          })();
          ROBOEOF
          U="$APP_URL"
          case "$U" in http*) ;; *) U="https://$U" ;; esac
          printf '%s' "$U" > app/src/main/assets/url.txt
          echo "Site: $U"
          curl -fsSL --max-time 30 "${U%/}/icon-512.png" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          python3 - <<'PYEOF2'
          import struct, zlib
          p = "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          sig = b"\x89PNG\r\n\x1a\n"
          try:
              ok = open(p, "rb").read(8) == sig
          except Exception:
              ok = False
          if not ok:
              print("No site icon found, using a plain green icon")
              n = 192
              raw = b"".join(b"\x00" + bytes([45, 255, 160, 255]) * n for _ in range(n))
              def ch(t, d):
                  c = struct.pack(">I", len(d)) + t + d
                  return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              png = sig + ch(b"IHDR", struct.pack(">IIBBBBB", n, n, 8, 6, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw)) + ch(b"IEND", b"")
              open(p, "wb").write(png)
          PYEOF2
          find . -type f | sort
      - name: Build the APK
        working-directory: robo
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp robo/app/build/outputs/apk/debug/app-debug.apk ROBO-EA.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ROBO EA app ${{ github.run_number }}
          files: ROBO-EA.apk
